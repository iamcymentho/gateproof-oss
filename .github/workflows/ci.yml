name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  sdk-dotnet:
    name: .NET SDK and published contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        working-directory: sdk/dotnet
        run: dotnet build --configuration Release

      # Also validates examples/ against schemas/ and checks the OpenAPI document.
      - name: Test
        working-directory: sdk/dotnet
        run: dotnet test --configuration Release --no-build

      - name: Pack
        working-directory: sdk/dotnet
        run: dotnet pack src/GateProof.Client --configuration Release --no-build --output ../../artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
